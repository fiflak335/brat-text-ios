name: Build iOS .ipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (ad-hoc signed)
        run: |
          xcodebuild \
            -project BratText.xcodeproj \
            -target BratText \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Release-iphoneos/BratText.app" Payload/
          zip -qr BratText.ipa Payload
          ls -lh BratText.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratText.ipa
          path: BratText.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "brat-text-ios-${{ github.run_number }}" \
            BratText.ipa \
            --repo "${{ github.repository }}" \
            --title "brat text generator iOS — build #${{ github.run_number }}" \
            --notes "Ad-hoc signed .ipa (with app icon). Sideload with AltStore, Sideloadly or Apple Configurator 2 — they will re-sign with your Apple ID."